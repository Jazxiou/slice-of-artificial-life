[tool.poetry]
name = "generative-agents"
version = "0.1.0"
description = "Generative Agents: Interactive Simulacra of Human Behavior"
authors = ["Stanford HCI Group <joonspk@stanford.edu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9, <3.13"
aiohttp = "3.8.3"
aiosignal = "1.3.1"
asgiref = "3.5.2"
async-generator = "1.10"
async-timeout = "4.0.2"
attrs = "22.2.0"
certifi = "2021.10.8"
charset-normalizer = "2.0.12"
click = "8.0.3"
django = "2.2"
frozenlist = "1.3.3"
multidict = "6.0.4"
numpy = "1.25.2"
openai = "0.27.0"
pillow = "8.4.0"
python-dateutil = "2.8.2"
pytz = "2021.3"
regex = "2021.11.10"
requests = "2.26.0"
six = "1.16.0"
sqlparse = "0.4.3"
tqdm = "4.62.3"
typing-extensions = "4.0.0"
urllib3 = "1.26.7"
yarl = "1.8.2"
idna = "3.3"
exceptiongroup = "1.1.0"
sniffio = "1.3.0"
h11 = "0.14.0"
packaging = "23.0"
pyparsing = "3.0.6"
scipy = "1.11.1"
boto = "2.49.0"
botocore = "1.29.43"
cycler = "0.11.0"
dj-database-url = "0.5.0"

[tool.poetry.group.dev.dependencies]
# Development dependencies will be added here

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "slice-of-artificial-life"
version = "0.1.0"
description = "A memory and persona architecture for believable generative-agent societies, built on Generative Agents."
readme = "README.md"
requires-python = ">=3.10, <3.12"
dependencies = [
    "django>=2.2,<3",
    "django-cors-headers>=2.5,<3",
    "numpy>=1.24,<2",
    "openai>=1.0,<2",
    "sentence-transformers>=2.2,<3",
]

[dependency.groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
package = false

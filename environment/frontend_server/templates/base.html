<!doctype html>
{% load staticfiles %}
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Reverie</title>
        <!--
        Bootstrap, served from static_dirs/vendor rather than a CDN.
        -->
        <link
            rel="stylesheet"
            href="{% static 'vendor/bootstrap-3.4.1/css/bootstrap.min.css' %}"
        />
        <!-- Optional theme -->
        <link
            rel="stylesheet"
            href="{% static 'vendor/bootstrap-3.4.1/css/bootstrap-theme.min.css' %}"
        />
    </head>

    <body class="top-navigation" style="background-color: white">
        {% block content %} {% endblock content %}

        <!-- Latest compiled and minified JavaScript (jQuery first) -->
        <script
            src="{% static 'vendor/jquery-1.11.1/jquery.min.js' %}"
            type="text/javascript"
        ></script>
        <script src="{% static 'vendor/bootstrap-3.4.1/js/bootstrap.min.js' %}"></script>

        {% block js_content %} {% endblock js_content %} {% comment %} Removed
        ClustrMaps {% endcomment %}
    </body>
</html>
